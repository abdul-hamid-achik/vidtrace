<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="630" fill="#0F172A"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- Film strip icon -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="120" height="120" rx="10" fill="#1E293B" stroke="url(#grad)" stroke-width="3"/>
    <!-- sprocket holes -->
    <rect x="6" y="8" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="6" y="24" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="6" y="40" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="6" y="56" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="6" y="72" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="6" y="88" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="6" y="104" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="106" y="8" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="106" y="24" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="106" y="40" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="106" y="56" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="106" y="72" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="106" y="88" width="8" height="8" rx="1" fill="url(#grad)"/>
    <rect x="106" y="104" width="8" height="8" rx="1" fill="url(#grad)"/>
    <!-- play triangle -->
    <polygon points="44,38 44,82 82,60" fill="url(#grad)"/>
  </g>

  <!-- Wordmark -->
  <text x="240" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" font-size="72" letter-spacing="-3" fill="url(#grad-text)">vidtrace</text>

  <!-- Tagline -->
  <text x="240" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="600" font-size="30" fill="#E2E8F0">Bug video evidence, timestamped.</text>

  <!-- Subtitle -->
  <text x="240" y="370" font-family="-apple-system,system-ui,sans-serif" font-weight="400" font-size="20" fill="#94A3B8">Turn screen recordings into structured evidence for</text>
  <text x="240" y="398" font-family="-apple-system,system-ui,sans-serif" font-weight="400" font-size="20" fill="#94A3B8">humans and coding agents.</text>

  <!-- Bottom badge -->
  <rect x="240" y="440" width="180" height="36" rx="18" fill="#1E293B" stroke="#0F766E" stroke-width="1.5"/>
  <text x="330" y="463" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="600" font-size="14" fill="#06B6D4" text-anchor="middle">Local-first Go CLI</text>

  <rect x="432" y="440" width="80" height="36" rx="18" fill="#1E293B" stroke="#0F766E" stroke-width="1.5"/>
  <text x="472" y="463" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="600" font-size="14" fill="#06B6D4" text-anchor="middle">MIT</text>

  <!-- Gradient line at bottom -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#grad)"/>
</svg>